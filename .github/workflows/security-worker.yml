name: Segurança do scraper worker
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contrato:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar token de acesso e fail-closed
        run: node --test scraper-worker/tests/*.test.cjs
      - name: Verificar sintaxe do servidor worker
        run: node --check scraper-worker/server.js
