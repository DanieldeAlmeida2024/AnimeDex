services:
  animedex-scraper:
    build: .
    container_name: animedex-scraper
    restart: unless-stopped
    environment:
      PORT: 8787
      BIND_HOST: 0.0.0.0
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?defina_WORKER_API_TOKEN_no_env}
      ANIMEFIRE_BASE_URL: ${ANIMEFIRE_BASE_URL:-https://animefire.one}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-60000}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-1800000}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-500}
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - animedex

networks:
  animedex:
    driver: bridge
