services:
  animedex-scraper:
    build: .
    container_name: animedex-scraper
    restart: unless-stopped
    environment:
      PORT: 8787
      ANIMEFIRE_BASE_URL: ${ANIMEFIRE_BASE_URL:-https://animefire.plus}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-60000}
    ports:
      - "8787:8787"
    networks:
      - animedex

networks:
  animedex:
    driver: bridge
